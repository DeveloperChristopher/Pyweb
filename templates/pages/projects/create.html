{% extends "layout.html" %}

{% block title %}
    Project Create 
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/static/css/form.css">

{% endblock %}

{% block main %}
    <div id="container">
        <div id="wrapper">
        <h2>Create Project</h2>
        <form action="/store/project" method="post" enctype="multipart/form-data">
            <label for="">Photo</label>
            <input type="file" name="image" id="" required accept=".jpg,.png,.jpg,.jpeg,.svg,.gif,.webp">
            <input type="text" name="title" placeholder="Title" id="" required>
            <textarea name="body" placeholder="body" id="" required></textarea>
            <label for="">Project</label>
            <input type="file" name="project" id="" required accept=".zip">
            <input type="submit" value="Create Project">
        </form>
        {% for msg in get_flashed_messages() %}
            <p class="flash">{{ msg }}</p>
        {% endfor %}
        </div>
    </div>
{% endblock %}
