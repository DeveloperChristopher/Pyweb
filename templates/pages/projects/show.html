{% extends "layout.html" %}

{% block title %}
    Projects
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/static/css/project.css">

{% endblock %}

{% block main %}
<!-- Pagina is ook geschreven met AI -->
    <div id="project-container">
        <div id="project-wrapper">
            {% if session["user_id"] %}
                <ul id="btn-list">
                    <li><a href="/update/project?id={{project[0][0]}}" class="project-btn">Update Project</a></li>
                    <li><a href="/delete/project?id={{project[0][0]}}" class="project-btn">Delete Project</a></li>
                </ul>
            {% endif %}
            <div id="header-img">
                <img src="/static/img/projects/{{ project[0][0] }}.{{ project[0][3] }}" alt="" srcset="">
            </div>
            <h2>{{ project[0][1] }}</h2>
            <p>{{ project[0][2] }}</p>
            <div id="download-container">
                <a href="/static/projects/{{project[0][0]}}.zip" id="download-btn">
                    <button>Download</button>
                </a>
            </div>
        </div>
    </div>
{% endblock %}
